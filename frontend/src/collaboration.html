<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>砚台协作编辑器</title><style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#203c36;background:#f5f8f7}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dfe8e3;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}h2{font-size:18px}p{line-height:1.7;color:#61736c}main{max-width:1450px;margin:auto;padding:24px;display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:22px}.panel{background:white;border:1px solid #dce7e0;border-radius:12px;padding:20px;margin-bottom:18px}label{display:block;font-size:13px;margin:14px 0}input,select,textarea{display:block;width:100%;padding:10px;border:1px solid #d2ded7;border-radius:7px;background:white;color:#203c36;font:inherit;margin-top:6px}button,.button{padding:9px 13px;border:1px solid #c4d9ce;border-radius:7px;background:white;color:#236e59;cursor:pointer;margin:4px 4px 4px 0;font:inherit;font-size:13px}button.primary{background:#26785e;color:white}button:disabled{opacity:.5;cursor:default}.hidden{display:none!important}#login{max-width:430px;margin:50px auto}.status{font-size:12px;color:#53786a}.notice{padding:12px 20px;background:#fff5d8;border-radius:8px;margin:12px 0}.error{color:#a53e2e;background:#fff0ea;padding:12px;border-radius:8px;white-space:pre-wrap}#editor{min-height:450px}#editor .block{padding:10px 4px;border-bottom:1px solid #edf1ed}#editor .inline-input{display:inline-block;min-width:30px;min-height:24px;padding:2px 5px;border-radius:3px;white-space:pre-wrap;word-break:break-word;outline:none}#editor .inline-input[contenteditable=true]{background:#f4f8f6;border-bottom:1px solid #c7dace}#editor .chip{padding:2px 6px;color:#356c59;background:#e7f1ec;border-radius:3px;font-size:12px}#editor img{max-width:100%}#editor .formula{white-space:pre-wrap;background:#f4f7f5;padding:15px;text-align:center}.history{font-size:12px;border-bottom:1px solid #e6ece8;padding:10px 0;white-space:pre-wrap;word-break:break-word}.section-button{display:block;width:100%;text-align:left}.section-button.selected{background:#e9f3ed}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#account{font-size:12px}#offline{font-size:12px}.conflict-box{margin:10px 0;padding:10px;border:1px solid #e4c09e;border-radius:7px}.conflict-box pre{max-height:220px;overflow:auto;white-space:pre-wrap;font-size:12px}#sync-warning{white-space:pre-wrap;font-size:13px}.review-caption{font-size:12px;color:#61736c}@media(max-width:1100px){main{grid-template-columns:230px minmax(0,1fr)}aside.right{grid-column:1/-1}}@media(max-width:650px){main{display:block;padding:12px}header{padding:14px}input,textarea,select{font-size:14px}}
</style></head><body><header><h1>砚台 · 协作编辑器</h1><span id="account">账号、项目权限与修订历史分别管理</span></header>
<div id="login" class="panel"><h2>登录协作空间</h2><p>使用本协作服务的账号。首次管理员在本机工作台建立。</p><form id="login-form"><label>用户名<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form><p id="login-error" role="alert"></p></div>
<main id="workspace" class="hidden"><aside><section class="panel"><label>论文项目<select id="project"></select></label><div id="sections"></div><form id="new-section" class="hidden"><label>新章节标题<input id="section-title" required></label><button>建立章节</button></form><form id="new-project"><label>新项目名称<input id="project-title" required></label><button>建立我的项目</button></form><button id="logout">退出账号</button></section><section class="panel"><h2>连接与草稿</h2><p id="connection" class="status">连接中…</p><p id="presence" class="status"></p><p id="offline">正在读取本机待提交修改…</p><button id="flush">提交本机队列</button><p>修改加密保存在本浏览器，重新登录后可恢复；网络恢复后按操作ID重试。各账号使用不同的加密密钥。</p></section></aside>
<section><div id="message" role="status"></div><div id="error" role="alert"></div><section class="panel"><div class="toolbar"><h2 id="chapter-name">选择章节</h2><span id="role" class="status"></span><button id="save" class="primary">保存当前修改</button><button id="add-paragraph">添加段落</button><button id="refresh">读取最新版本</button><button id="ai-generate">生成AI候选稿（计费）</button></div><p id="sync-warning" class="notice hidden"></p><div id="editor"></div><p class="review-caption">引文、脚注、图表与公式保留为结构节点；复杂Word版式在本机保真编辑和导出。</p></section><section id="ai-panel" class="panel hidden"><h2>AI候选与真实增量</h2><p id="ai-state"></p><pre id="ai-text" style="white-space:pre-wrap;max-height:400px;overflow:auto"></pre><button id="ai-accept" disabled>接受此候选版本</button></section><section class="panel"><h2>冲突分支</h2><p>不同段落的并发修改可自动合并。同一段落的冲突保留双方内容，由有编辑权限的用户选择或手工合并。</p><label><input id="conflict-history" type="checkbox" style="display:inline;width:auto">显示已处理冲突历史</label><div id="conflicts"></div></section></section>
<aside class="right"><section class="panel"><h2>成员与权限</h2><div id="members"></div><form id="member-form" class="hidden"><label>成员用户名<input id="member-name" required></label><label>项目角色<select id="member-role"><option value="editor">编辑者</option><option value="reviewer">审阅者</option><option value="viewer">只读成员</option><option value="owner">所有者</option></select></label><button>设置成员权限</button></form></section><section class="panel"><h2>批注与审阅</h2><form id="comment-form"><label>意见<textarea id="comment" rows="3" required></textarea></label><button>提交批注</button></form><button id="review">登记本版本已审阅</button><div id="comments"></div></section><section id="admin-panel" class="panel hidden"><h2>账号管理</h2><form id="user-form"><label>新账号用户名<input id="user-name" required></label><label>新账号密码<input id="user-password" type="password" minlength="12" required autocomplete="new-password"></label><button>建立普通账号</button></form><div id="users"></div></section></aside></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let csrf='',user=null,pid='',sid='',snapshot=null,revision=null,documentValue=null,dirty=false,saving=false,editable=false,ws=null,cursor=0,saveTimer=null,queueDB=null,cacheCryptoKey=null,permissionBlocked=false;
const clone=x=>JSON.parse(JSON.stringify(x));const uuid=()=>crypto.randomUUID();
function text(value){if(value?.type==='text')return value.text||'';if(value?.type==='footnote')return '[脚注 '+(value.attrs?.noteText||'')+']';if(value?.type==='formula')return value.attrs?.latex||value.attrs?.expression||'[Word公式]';return(value?.content||[]).map(text).join(value?.type==='doc'?'\n':'')}
function notify(s,error=false){$(error?'error':'message').className=error?'error':'notice';$(error?'error':'message').textContent=s;if(!error)setTimeout(()=>{$('message').textContent='';$('message').className=''},4500)}
const COLLAB_ROUTES = [["/session", "/collaboration/auth/session", "GET"], ["/logout", "/collaboration/auth/logout", "POST"], ["/login", "/collaboration/auth/login", "POST"], ["/projects", "/collaboration/projects", "GET"], ["/projects", "/collaboration/projects", "POST"], ["/import", "/collaboration/import", "POST"], ["/users", "/collaboration/users", "POST"], ["/users", "/collaboration/users", "GET"], ["/projects/{pid}/operations", "/projects/{project_id}/collaboration/operations", "POST"], ["/projects/{pid}/conflicts", "/projects/{project_id}/collaboration/conflicts", "GET"], ["/projects/{pid}/snapshot", "/projects/{project_id}/collaboration/snapshot", "GET"], ["/projects/{pid}/sections", "/projects/{project_id}/collaboration/sections", "POST"], ["/projects/{pid}/comments", "/projects/{project_id}/collaboration/comments", "POST"], ["/projects/{pid}/members", "/projects/{project_id}/collaboration/members", "PUT"], ["/projects/{pid}/events", "/projects/{project_id}/collaboration/events", "GET"], ["/projects/{pid}/bundle", "/projects/{project_id}/collaboration/bundle", "GET"], ["/projects/{pid}/live", "/projects/{project_id}/collaboration/live", "WEBSOCKET"], ["/users/{uid}", "/collaboration/users/{user_id}", "PATCH"], ["/projects/{pid}/conflicts/{cid}/restore", "/projects/{project_id}/collaboration/conflicts/{conflict_id}/actions/restore", "POST"], ["/projects/{pid}/sections/{sid}/accept", "/projects/{project_id}/collaboration/sections/{section_id}/actions/accept", "POST"], ["/projects/{pid}/sections/{sid}/writing", "/projects/{project_id}/collaboration/sections/{section_id}/writing", "POST"], ["/projects/{pid}/sections/{sid}/review", "/projects/{project_id}/collaboration/sections/{section_id}/review", "POST"], ["/projects/{pid}/conflicts/{cid}", "/projects/{project_id}/collaboration/conflicts/{conflict_id}", "POST"], ["/projects/{pid}/artifacts/{aid}", "/projects/{project_id}/collaboration/artifacts/{artifact_id}", "GET"], ["/projects/{pid}/tasks/{tid}/stream", "/projects/{project_id}/collaboration/tasks/{task_id}/stream", "GET"], ["/projects/{pid}/tasks/{tid}", "/projects/{project_id}/collaboration/tasks/{task_id}", "GET"], ["/projects/{pid}/files/{fid}", "/projects/{project_id}/collaboration/files/{file_id}", "GET"]]; // generated API contract
function collaborationUrl(path,method='GET'){const [pathname,query]=path.split('?');for(const [old,target,verb] of COLLAB_ROUTES){if(verb!==method&&!(verb==='WEBSOCKET'&&method==='GET'))continue;const regex=new RegExp('^'+old.replace(/\{[^}]+\}/g,'([^/]+)')+'$');const match=pathname.match(regex);if(match){let i=0;return '/api/v2'+target.replace(/\{[^}]+\}/g,()=>match[++i])+(query===undefined?'':'?'+query)}}throw Error('未注册的协作接口：'+pathname)}
async function call(path,body,method='GET'){const r=await fetch(collaborationUrl(path,method),{method,headers:{'Content-Type':'application/json',...(csrf?{'X-CSRF-Token':csrf}:{})},...(body===undefined?{}:{body:JSON.stringify(body)})});let d;try{d=await r.json()}catch{throw Error('服务返回的数据格式无效')}if(!r.ok){const detail=d.error??d.detail??d;const error=Error(typeof detail==='string'?detail:detail.message??JSON.stringify(detail));error.status=r.status;error.data=d;throw error}if(d.meta?.api_version==='v2'){if(d.meta.kind==='collection')return d.data.items;if(d.meta.kind==='task')return d.data.task;return d.data}return d}
function queueOpen(){return new Promise((resolve,reject)=>{const request=indexedDB.open('paper-collaboration-v1',1);request.onupgradeneeded=()=>request.result.createObjectStore('operations',{keyPath:'key'});request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
function qrun(mode,fn){return new Promise((resolve,reject)=>{const tx=queueDB.transaction('operations',mode),store=tx.objectStore('operations');let req;try{req=fn(store)}catch(e){reject(e);return}tx.oncomplete=()=>resolve(req?.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
const draftKey=(p,s)=>user.id+':'+p+':'+s;
function b64(bytes){let result='';for(const b of bytes)result+=String.fromCharCode(b);return btoa(result)}
function unb64(value){return Uint8Array.from(atob(value),c=>c.charCodeAt(0))}
async function qput(row){const iv=crypto.getRandomValues(new Uint8Array(12));const encoded=await crypto.subtle.encrypt({name:'AES-GCM',iv},cacheCryptoKey,new TextEncoder().encode(JSON.stringify(row)));return qrun('readwrite',store=>store.put({key:row.key,owner:row.owner,iv:b64(iv),encrypted:b64(new Uint8Array(encoded))}))}
async function qdecode(row){if(!row)return null;if(row.owner!==user.id)throw Error('离线草稿不属于当前账号');if(!row.encrypted)return row;const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(row.iv)},cacheCryptoKey,unb64(row.encrypted));return JSON.parse(new TextDecoder().decode(raw))}
async function qget(key){return qdecode(await qrun('readonly',store=>store.get(key)))}

async function queueStats(){if(!user)return [];const all=await qrun('readonly',s=>s.getAll());const count=all.filter(x=>x.owner===user.id).length;$('offline').textContent='本账号本机待提交：'+count+' 条';return Promise.all(all.filter(x=>x.owner===user.id).map(qdecode))}
async function queueCurrent(){if(!editable||!sid||!documentValue)return;const row={key:draftKey(pid,sid),owner:user.id,pid,section_id:sid,operation_id:uuid(),base_revision_id:revision,document:clone(documentValue),auto_merge:true,updated_at:Date.now()};await qput(row);await queueStats();return row}
function mergeLocal(base,remote,current){const key=d=>new Map((d.content||[]).map(n=>[n.attrs?.nodeId,n]));const b=key(base),r=key(remote),c=key(current);const result=clone(remote);const rows=new Map(result.content.map(n=>[n.attrs?.nodeId,n]));for(const [id,n] of c)if(JSON.stringify(n)!==JSON.stringify(b.get(id)))rows.set(id,clone(n));result.content=result.content.map(n=>rows.get(n.attrs?.nodeId));return result}
async function flushOne(row){const inflightKey=draftKey(row.pid,row.section_id)+':sending:'+row.operation_id;await qput({...row,key:inflightKey,inflight:true});try{const result=await call('/projects/'+row.pid+'/operations',{operation_id:row.operation_id,section_id:row.section_id,base_revision_id:row.base_revision_id,document:row.document,auto_merge:true},'POST');const queued=await qget(draftKey(row.pid,row.section_id));if(queued?.operation_id===row.operation_id)await qrun('readwrite',s=>s.delete(draftKey(row.pid,row.section_id)));else if(queued){queued.document=mergeLocal(row.document,JSON.parse(result.revision.document),queued.document);queued.base_revision_id=result.revision.id;await qput(queued)}await qrun('readwrite',s=>s.delete(inflightKey));if(snapshot&&row.pid===pid){const section=snapshot.sections.find(s=>s.id===row.section_id);if(section)section.current_revision_id=result.revision.id;if(!snapshot.revisions.some(r=>r.id===result.revision.id))snapshot.revisions.push(result.revision)}if(row.pid===pid&&row.section_id===sid){revision=result.revision.id;if(queued?.operation_id===row.operation_id){const accepted=JSON.parse(result.revision.document);const repaint=JSON.stringify(accepted.content)!==JSON.stringify(documentValue.content);if(repaint){documentValue=accepted;renderEditor()}else documentValue.attrs=accepted.attrs;dirty=false;$('sync-warning').classList.add('hidden')}else if(queued){documentValue=queued.document;dirty=true}}return true}catch(error){if(error.status===409&&error.data?.conflict_id){await qrun('readwrite',s=>s.delete(inflightKey));const current=await qget(draftKey(row.pid,row.section_id));if(current?.operation_id===row.operation_id)await qrun('readwrite',s=>s.delete(current.key));notify('检测到重叠修改，已保留为冲突分支。',true);await loadConflicts();return false}if([401,403,404].includes(error.status))permissionBlocked=true;throw error}finally{await queueStats()}}
async function flush(){if(saving||!user)return;saving=true;try{const rows=(await queueStats()).sort((a,b)=>a.updated_at-b.updated_at);const sent=new Set();for(const row of rows){if(sent.has(row.operation_id))continue;sent.add(row.operation_id);const current=row.inflight?row:await qget(row.key);if(current)await flushOne(current)}if(!dirty)notify('已提交本机待保存修改')}catch(e){notify('尚未提交：'+e.message+'。本机队列已保留。',true)}finally{saving=false;if(dirty&&navigator.onLine&&!permissionBlocked){const queued=await qget(draftKey(pid,sid));if(queued)saveTimer=setTimeout(flush,900)}}}
async function markDirty(){dirty=true;try{await queueCurrent();clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}catch(e){notify('本机草稿保存失败：'+e.message,true)}}
function paint(node,parent,allowed=editable,path=''){path=node.attrs?.nodeId||path;allowed=allowed&&!(snapshot?.locks||[]).some(l=>l.section_id===sid&&l.node_id===node.attrs?.nodeId);if(node.type==='text'){const span=document.createElement('span');span.className='inline-input';span.dataset.runKey=path;span.textContent=node.text||'';span.contentEditable=String(allowed);for(const mark of node.marks||[]){if(mark.type==='bold')span.style.fontWeight='700';if(mark.type==='italic')span.style.fontStyle='italic';if(mark.type==='underline')span.style.textDecoration='underline'}span.addEventListener('input',()=>{node.text=span.innerText;markDirty()});parent.append(span);return}if(node.type==='citation'||node.type==='footnote'||node.type==='crossReference'){const chip=document.createElement('span');chip.className='chip';chip.textContent=node.type==='footnote'?'[脚注]':node.type==='citation'?'[引文]':'[交叉引用]';chip.title=node.attrs?.noteText||node.attrs?.citationId||'';if(node.type==='citation'){const ref=snapshot?.references?.find(r=>r.id===node.attrs.citationId);if(ref){let meta;try{meta=JSON.parse(ref.metadata)}catch{meta={}}chip.title=(meta.title||'文献')+' · '+(meta.authors||'')+' · '+(meta.year||'');if(ref.file_id){const link=document.createElement('a');link.href=collaborationUrl('/projects/'+pid+'/files/'+ref.file_id);link.target='_blank';link.rel='noopener';link.append(chip);parent.append(link);return}}}parent.append(chip);return}if(node.type==='formula'){const formula=document.createElement('div');formula.className='formula';formula.textContent=text(node);parent.append(formula);return}if(node.type==='figure'){const img=document.createElement('img');img.src=collaborationUrl('/projects/'+pid+'/artifacts/'+node.attrs.artifactId);img.alt=node.attrs.caption||'研究图表';parent.append(img);return}const block=document.createElement(node.type==='heading'?'h3':'div');block.className='block';for(const [i,child] of (node.content||[]).entries())paint(child,block,allowed,path+'/'+i);if(!(node.content||[]).length&&allowed&&node.type==='paragraph'){const t={type:'text',text:''};node.content=[t];paint(t,block,allowed)}parent.append(block)}
function renderEditor(){const selection=getSelection();const element=selection?.focusNode?.nodeType===3?selection.focusNode.parentElement:selection?.focusNode;const span=element?.closest?.('.inline-input');const caret=span&&$('editor').contains(span)?{key:span.dataset.runKey,offset:selection.focusOffset}:null;$('editor').replaceChildren();if(documentValue)for(const block of documentValue.content||[])paint(block,$('editor'));$('save').disabled=!editable||!sid;$('add-paragraph').disabled=!editable||!sid;$('ai-generate').disabled=!sid||!snapshot?.remote_ai_allowed||!snapshot?.rule_package_ready;$('new-section').classList.toggle('hidden',!editable);$('review').disabled=!sid||snapshot?.role==='viewer';$('comment-form').classList.toggle('hidden',snapshot?.role==='viewer');if(caret&&editable){const target=[...$('editor').querySelectorAll('.inline-input')].find(e=>e.dataset.runKey===caret.key&&e.contentEditable==='true');if(target){target.focus();const range=document.createRange();range.setStart(target.firstChild||target,Math.min(caret.offset,target.firstChild?.textContent?.length||0));range.collapse(true);selection.removeAllRanges();selection.addRange(range)}}}
async function selectSection(id){if(dirty)await queueCurrent();sid=id;const sec=snapshot.sections.find(s=>s.id===sid);revision=sec?.current_revision_id||null;const stored=snapshot.revisions.find(r=>r.id===revision);documentValue=stored?JSON.parse(stored.document):{type:'doc',content:[{type:'paragraph',attrs:{nodeId:uuid()},content:[{type:'text',text:''}]}]};const queued=await qget(draftKey(pid,sid));dirty=!!queued;if(queued){documentValue=queued.document;revision=queued.base_revision_id;notify('已恢复本浏览器未提交的修改')}$('chapter-name').textContent=sec?.title||'选择章节';renderEditor();renderSections()}
function renderSections(){$('sections').replaceChildren();for(const sec of snapshot.sections.filter(s=>s.state!=='archived')){const button=document.createElement('button');button.className='section-button'+(sec.id===sid?' selected':'');button.textContent=sec.title;button.onclick=()=>selectSection(sec.id).catch(e=>notify(e.message,true));$('sections').append(button)}}
async function loadProject(){if(!pid)return;snapshot=await call('/projects/'+pid+'/snapshot');editable=['owner','editor'].includes(snapshot.role);$('role').textContent={owner:'所有者',editor:'编辑者',reviewer:'审阅者',viewer:'只读'}[snapshot.role];$('member-form').classList.toggle('hidden',snapshot.role!=='owner');$('members').replaceChildren();for(const member of snapshot.members){const p=document.createElement('p');p.textContent=member.username+' · '+member.role;$('members').append(p)}renderSections();if(!sid||!snapshot.sections.some(s=>s.id===sid))sid=snapshot.sections[0]?.id||'';if(sid)await selectSection(sid);else{documentValue=null;renderEditor()};await loadConflicts();connect()}
async function projects(){const rows=await call('/projects');$('project').replaceChildren();for(const row of rows){const o=document.createElement('option');o.value=row.id;o.textContent=row.title;$('project').append(o)}if(!rows.some(p=>p.id===pid)){pid=rows[0]?.id||'';sid=''}$('project').value=pid;if(pid)await loadProject();else $('chapter-name').textContent='建立或加入项目后开始协作'}
async function loadConflicts(){if(!pid)return;const rows=await call('/projects/'+pid+'/conflicts?include_resolved='+$('conflict-history').checked);$('conflicts').replaceChildren();for(const row of rows){const box=document.createElement('div');box.className='conflict-box';const p=document.createElement('p');p.textContent='章节 '+(snapshot?.sections.find(s=>s.id===row.section_id)?.title||row.section_id)+' · '+row.state;box.append(p);const preview=document.createElement('pre');preview.textContent='待合并分支：\n'+text(JSON.parse(row.remote_document));box.append(preview);if(editable&&row.state==='open')for(const [choice,label] of [['keep_local','保留服务器当前版本'],['take_remote','采用待合并分支']]){const button=document.createElement('button');button.textContent=label;button.onclick=async()=>{try{const latest=await call('/projects/'+pid+'/snapshot');const sec=latest.sections.find(s=>s.id===row.section_id);await call('/projects/'+pid+'/conflicts/'+row.id,{choice,base_revision_id:sec.current_revision_id},'POST');dirty=false;await loadProject();notify('冲突处理已保存')}catch(e){notify(e.message,true)}};box.append(button)}if(editable&&row.state!=='open'){const restore=document.createElement('button');restore.textContent='将此分支另存为当前新版本';restore.onclick=async()=>{try{const latest=await call('/projects/'+pid+'/snapshot');const section=latest.sections.find(s=>s.id===row.section_id);await call('/projects/'+pid+'/conflicts/'+row.id+'/restore',{base_revision_id:section.current_revision_id},'POST');dirty=false;await loadProject();notify('已恢复为新版本，原冲突历史仍保留')}catch(e){notify(e.message,true)}};box.append(restore)}$('conflicts').append(box)}}
function connect(){if(ws){ws.onclose=null;ws.close()}if(!pid)return;const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(proto+'//'+location.host+collaborationUrl('/projects/'+pid+'/live?after='+cursor));ws.onopen=()=>{$('connection').textContent='版本同步在线'};ws.onclose=()=>{$('connection').textContent='连接已断开；本机修改会保留';if(user)setTimeout(()=>{if(user&&pid)connect()},3000)};ws.onmessage=async event=>{const message=JSON.parse(event.data);if(message.seq)cursor=Math.max(cursor,message.seq);if(message.kind==='heartbeat'){if(message.users)$('presence').textContent='在线成员：'+message.users.join('、');return}if(message.kind==='comment'){const d=JSON.parse(message.payload);const p=document.createElement('div');p.className='history';p.textContent=d.text;$('comments').prepend(p)}if(message.kind==='revision'){const payload=JSON.parse(message.payload);if(payload.section_id===sid&&payload.revision_id===revision)return}if(['revision','section_created','conflict_resolved','membership','packet_import'].includes(message.kind)){if(dirty||saving){$('sync-warning').classList.remove('hidden');$('sync-warning').textContent='协作版本有更新。保存时将比较基础版本；重叠修改会保留双方内容。'}else{try{const next=await call('/projects/'+pid+'/snapshot');const nextEditable=['owner','editor'].includes(next.role);const head=next.sections.find(s=>s.id===sid)?.current_revision_id;snapshot=next;const roleChanged=editable!==nextEditable;editable=nextEditable;renderSections();if(sid&&(head!==revision||roleChanged))await selectSection(sid)}catch(e){notify(e.message,true)}}}if(message.kind==='conflict')loadConflicts().catch(()=>{})}}
async function loadUsers(){if(!user.admin)return;const rows=await call('/users');$('users').replaceChildren();for(const row of rows){const p=document.createElement('div');p.className='history';p.textContent=row.username+' · '+(row.admin?'管理员':'成员')+' · '+(row.disabled?'已停用':'可用');const button=document.createElement('button');button.textContent=row.disabled?'启用':'停用';button.onclick=async()=>{try{await call('/users/'+row.id,{disabled:!row.disabled},'PATCH');await loadUsers()}catch(e){notify(e.message,true)}};p.append(button);const budget=document.createElement('button');budget.textContent='分配AI预算';budget.onclick=async()=>{const amount=prompt('本账号的协作AI预算（未知费用按预留计入）','0');if(amount===null)return;try{await call('/users/'+row.id,{ai_budget:Number(amount)},'PATCH');notify('账号预算已更新')}catch(e){notify(e.message,true)}};p.append(budget);$('users').append(p)}}
async function enter(info){user=info.user||info;csrf=info.csrf;cacheCryptoKey=await crypto.subtle.importKey('raw',unb64(info.offline_key),'AES-GCM',false,['encrypt','decrypt']);permissionBlocked=false;queueDB=await queueOpen();$('account').textContent=user.username;$('login').classList.add('hidden');$('workspace').classList.remove('hidden');$('admin-panel').classList.toggle('hidden',!user.admin);await projects();await queueStats();await loadUsers()}
let aiTask=null,aiResult=null,aiTimer=null,aiContext=null;
$('ai-generate').onclick=async()=>{if(dirty){notify('请先保存本机修改，再生成候选。',true);return}const instruction=prompt('本节写作要求（模型调用按服务方规则计费）','请依据已发布规则和研究资料生成本节候选。');if(instruction===null)return;try{const r=await call('/projects/'+pid+'/sections/'+sid+'/writing',{base_revision_id:revision,instruction,acknowledge_charges:true},'POST');aiTask=r.task_id;aiContext={pid,sid};aiResult=null;$('ai-panel').classList.remove('hidden');$('ai-text').textContent='';$('ai-accept').disabled=true;clearInterval(aiTimer);let chunkCursor=0;const poll=async()=>{try{const task=await call('/projects/'+aiContext.pid+'/tasks/'+aiTask);$('ai-state').textContent=task.status+' · '+(task.phase||'');const stream=await call('/projects/'+aiContext.pid+'/tasks/'+aiTask+'/stream?after='+chunkCursor);for(const c of stream.chunks){if(c.seq>chunkCursor){$('ai-text').textContent+=c.text;chunkCursor=c.seq}}if(!['queued','running'].includes(task.status)){clearInterval(aiTimer);aiResult=task.result;if(task.status==='succeeded'&&aiResult?.document){$('ai-text').textContent=text(aiResult.document);$('ai-accept').disabled=false}else if(task.error)notify(task.error,true)}}catch(e){notify(e.message,true);clearInterval(aiTimer)}};await poll();aiTimer=setInterval(poll,900)}catch(e){notify(e.message,true)}};
$('ai-accept').onclick=async()=>{if(!aiTask||!aiResult||dirty)return;if(aiContext.pid!==pid||aiContext.sid!==sid){notify('请切回生成候选时的项目和章节',true);return}try{await call('/projects/'+pid+'/sections/'+sid+'/accept',{task_id:aiTask,base_revision_id:aiResult.base_revision_id},'POST');$('ai-accept').disabled=true;await loadProject();notify('已接受候选，仍需内容与格式人工核对')}catch(e){notify(e.message,true)}};
$('conflict-history').onchange=()=>loadConflicts().catch(e=>notify(e.message,true));
$('login-form').onsubmit=async e=>{e.preventDefault();try{const info=await call('/login',{username:$('username').value,password:$('password').value},'POST');$('password').value='';await enter(info)}catch(error){$('login-error').textContent=error.message}};
$('project').onchange=async()=>{if(dirty)await queueCurrent();pid=$('project').value;sid='';cursor=0;await loadProject()};
$('add-paragraph').onclick=async()=>{if(!editable||!documentValue)return;documentValue.content.push({type:'paragraph',attrs:{nodeId:uuid()},content:[{type:'text',text:''}]});renderEditor();await markDirty();const spans=$('editor').querySelectorAll('[contenteditable=true]');spans[spans.length-1]?.focus()};
$('save').onclick=async()=>{try{await queueCurrent();await flush()}catch(e){notify(e.message,true)}};$('flush').onclick=flush;$('refresh').onclick=async()=>{if(dirty&&!confirm('本机修改已排队保留。读取服务器版本？'))return;dirty=false;await loadProject()};
$('new-section').onsubmit=async e=>{e.preventDefault();try{const s=await call('/projects/'+pid+'/sections',{title:$('section-title').value},'POST');$('section-title').value='';sid=s.id;await loadProject()}catch(e){notify(e.message,true)}};
$('new-project').onsubmit=async e=>{e.preventDefault();try{const p=await call('/projects',{title:$('project-title').value},'POST');$('project-title').value='';pid=p.id;sid='';await projects()}catch(e){notify(e.message,true)}};
$('member-form').onsubmit=async e=>{e.preventDefault();try{await call('/projects/'+pid+'/members',{username:$('member-name').value,role:$('member-role').value},'PUT');await loadProject()}catch(e){notify(e.message,true)}};
$('comment-form').onsubmit=async e=>{e.preventDefault();try{await call('/projects/'+pid+'/comments',{text:$('comment').value},'POST');$('comment').value='';notify('意见已提交')}catch(e){notify(e.message,true)}};
$('review').onclick=async()=>{const note=prompt('填写本版本的人工核对说明');if(!note)return;try{await call('/projects/'+pid+'/sections/'+sid+'/review',{revision_id:revision,note,acknowledge:true},'POST');notify('已记录当前账号对指定版本的审阅声明')}catch(e){notify(e.message,true)}};
$('user-form').onsubmit=async e=>{e.preventDefault();try{await call('/users',{username:$('user-name').value,password:$('user-password').value},'POST');$('user-password').value='';$('user-name').value='';await loadUsers();notify('账号已建立')}catch(e){notify(e.message,true)}};
$('logout').onclick=async()=>{if(dirty)await queueCurrent();try{await call('/logout',{},'POST')}catch(e){if(e.status!==401){notify('服务器会话退出未完成，请网络恢复后重试。',true);return}}user=null;cacheCryptoKey=null;if(ws)ws.close();location.reload()};
window.addEventListener('online',()=>{if(user)flush()});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
(async()=>{try{await enter(await call('/session'))}catch{}})();
</script></body></html>
