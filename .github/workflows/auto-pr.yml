name: Maintain development PR
on:
  push:
    branches: ['feature/**','fix/**','develop']
permissions:
  contents: read
  pull-requests: write
jobs:
  pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update development PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          BODY_FILE="$RUNNER_TEMP/development-pr.md"
          cat > "$BODY_FILE" <<EOF
          Changes from ${BRANCH} into ${BASE}.

          Current source revision: ${GITHUB_SHA}.
          Automated checks run on this pull request.
          EOF
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --head "$BRANCH" --base "$BASE" --title "${BRANCH}" --body-file "$BODY_FILE"
          else
            gh pr edit "$PR_NUMBER" --body-file "$BODY_FILE"
          fi
